<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>employee registration form</title>
</head>
<body style="color: brown;">
    <h1 align="center">employee registration form</h1>
    <form id="form">
        <style>
            form{
                background-color: aqua;
                padding: 70px;
                width: 600px;
                margin: auto;
                border-radius: 10px;
            }
        </style>
    <label>FULL NAME:</label>
    <input type="text" name="FULL NAME" required placeholder="enter your name" id="name">
    <br></br>
       <label>USER NAME:</label>
    <input type="number" name="USER NAME" required placeholder="enter your username" id="username">
    <br></br>
           <label>EMAIL:</label>
    <input type="email" name="EMAIL" required placeholder="@gmail.com" id="email">
    <br></br>
              <label>PHONE NUMBER:</label>
    <input type="number" name="PHONE NUMBER" required placeholder="enter your phonenumber" id="phonenumber">
    <br></br>
       <label>PASSWORD:</label>
    <input type="password" name="PASSWORD" required placeholder="password"  id="password">
    <br></br>
    <label>CONFIRM PASSWORD:</label>
    <input type="password" name="CONFIRM PASSWORD" required placeholder="password"  id="confirmpassword">
    <br></br>
    <label>DATE OF BIRTH:</label>
    <input type="date" name="DATE OF BIRTH" required placeholder="doc"  id="dateofbirth">
    <br></br>
    <label>GENDER:</label>
    <input type="radio" name="GENDER" value="MALE">MALE
    <input type="radio" name="GENDER" value="FEMALE">FEMALE
    <input type="radio" name="GENDER" value="OTHERS">OTHERS
    <br></br>
    <label>ADDRESS</label>
    <textarea name="ADDRESS" rows="2" colspan="20"></textarea>
    <br></br>
    <label>CITY:</label>
    <input type="text" name="CITY" id="city">
    <br></br>
    <label for="state">State:</label>

<select id="state" name="state">
    <option value="">-- Select State --</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="West Bengal">West Bengal</option>
</select>
<br></br>
<label for="country">Country:</label>

<select id="country" name="country">
    <option value="">-- Select Country --</option>
    <option value="India">India</option>
    <option value="United States">United States</option>
    <option value="United Kingdom">United Kingdom</option>
    <option value="Canada">Canada</option>
    <option value="Australia">Australia</option>
    <option value="Germany">Germany</option>
    <option value="France">France</option>
    <option value="Japan">Japan</option>
    <option value="China">China</option>
    <option value="Singapore">Singapore</option>
</select>
<br></br>
<label for="pincode">Pincode:</label>
<input type="text" id="pincode" name="pincode" maxlength="6" placeholder="Enter Pincode">
<br></br>
<label>Hobbies:</label>

<input type="checkbox" id="reading" name="hobbies" value="Reading">
<label for="reading">Reading</label>

<input type="checkbox" id="music" name="hobbies" value="Music">
<label for="music">Music</label>

<input type="checkbox" id="sports" name="hobbies" value="Sports">
<label for="sports">Sports</label>

<input type="checkbox" id="dancing" name="hobbies" value="Dancing">
<label for="dancing">Dancing</label>

<input type="checkbox" id="traveling" name="hobbies" value="Traveling">
<label for="traveling">Traveling</label>
<br></br>
<input type="checkbox" id="bond" name="bond" required>
<label for="bond">
    I agree to the 2-year bond terms and conditions
</label>
<br></br>
<button>register</button>
<button>reset</button>
</form>
<script>
    document.getElementById("form").addEventListener("submit",
    function(event) {

        event.preventDefault();

        let name = document.getElementById("name").value;
        let username = document.getElementById("username").value;
        let email = document.getElementById("email").value;
        let phonenumber = document.getElementById("phonenumber").value;
        let password = document.getElementById("password").value;
        let confirmpassword = document.getElementById("confirmpassword").value;

        if (password != confirmpassword) {
            alert("Passwords do not match");
            return;
        }

        console.log("employee form");
        console.log("name:", name);
        console.log("username:", username);
        console.log("email:", email);
        console.log("phonenumber:", phonenumber);
        console.log("password:", password);

    });
</script>
</body>
</html>
